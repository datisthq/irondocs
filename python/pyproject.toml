[project]
name = "irondocs"
version = "0.3.0"
description = "Test codeblocks in pytest"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.12"
keywords = ["doctest", "irondocs", "markdown", "pytest", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["pytest>=8.0", "textlane>=0.5.0"]

[[project.authors]]
name = "Evgeny Karev"

[project.urls]
homepage = "https://irondocs.dev/python/introduction/"
repository = "https://github.com/datisthq/irondocs"

[project.entry-points.pytest11]
irondocs = "irondocs.plugins.pytest"

[dependency-groups]
dev = ["pytest-cov>=7.0.0", "ruff==0.15.0", "ty==0.0.87"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["irondocs"]
exclude = ["**/*_unit.py"]

[tool.hatch.build.targets.sdist]
include = ["irondocs", "README.md", "LICENSE.md"]
exclude = ["**/*_unit.py"]

[tool.uv]
# Same seven-day quarantine as minimumReleaseAge in pnpm-workspace.yaml; pin a hotfix
# through exclude-newer-package instead of shortening this for the whole tree
exclude-newer = "7 days"
# Our own package, exempt as pnpm-workspace.yaml exempts it: we are its maintainer
exclude-newer-package = { textlane = false }

[tool.ruff]
line-length = 90

[tool.ruff.lint]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p pytester"
python_files = ["*_unit.py"]
testpaths = ["irondocs", "docs", "README.md"]
irondocs_files = ["README.md", "docs/*.md"]
filterwarnings = ["error::UserWarning"]

[tool.coverage.run]
source = ["irondocs"]
omit = ["*_unit.py"]
